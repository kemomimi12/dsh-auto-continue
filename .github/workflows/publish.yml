name: publish

# Publish to GitHub Packages when a version tag is pushed.
#
# Usage:
#   npm version patch|minor|major   # bumps package.json and creates the tag
#   git push --follow-tags
#
# The workflow refuses to publish when the tag and package.json disagree, so a
# stale tag cannot ship a mismatched version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kemomimi12'

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "tag and package.json agree on $PKG_VERSION"

      # `npm run verify` runs the behavioural suite, the storm comparison, the
      # outage replay, and the packaging guard. prepublishOnly repeats it, but
      # failing here gives a clearer log.
      - name: Verify
        run: npm run verify

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "dry_run enabled — verified the package but did not publish"
